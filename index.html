<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fih</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .stage {
      position: relative;
      height: 100%;
      width: 100%;
      display: grid;
      place-items: center;
      background: #000;
    }

    img.hero {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .pill {
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      padding: 10px 12px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      line-height: 1.15;
      letter-spacing: 0.2px;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
    }

    .pill small {
      display: block;
      opacity: 0.8;
      font-weight: 500;
      margin-top: 4px;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      .hud { flex-direction: column; align-items: flex-start; }
      .pill { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="hud">
      <div class="pill" id="dateBox">
        <span id="dateText">—</span>
        <small>Date</small>
      </div>
      <div class="pill" id="timeBox">
        <span id="timeText">—</span>
        <small>Time</small>
      </div>
    </div>

    <img class="hero" src="2bfa437c-111c-4087-8569-228887b46a8c.png" alt="Image" />
  </div>

  <script>
    function updateDateTime() {
      const now = new Date();

      const dateStr = now.toLocaleDateString(undefined, {
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "numeric",
      });

      const timeStr = now.toLocaleTimeString(undefined, {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
      });

      document.getElementById("dateText").textContent = dateStr;
      document.getElementById("timeText").textContent = timeStr;
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>
</body>
</html>
